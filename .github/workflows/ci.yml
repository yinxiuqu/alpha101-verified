name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        # 依赖漂移守卫（设计文档 §9 R8）：算子在我们声称支持的 pandas 版本上行为必须一致
        pandas-version: ["2.1.4", "2.2.3", "2.3.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 运行时依赖只有 numpy/pandas/scipy；其余四个是测试期需要：
          # pymongo（真实数据适配器，无数据库时自动 skip）、pyarrow（parquet 快照/报告）、
          # matplotlib（使用指南示例与作图工具）、statsmodels（中性化对拍）
          pip install "numpy>=1.26" "pandas==${{ matrix.pandas-version }}" "scipy>=1.11" \
                      pytest statsmodels pymongo pyarrow matplotlib
      - name: Fetch differential reference
        run: bash tools/fetch_vnpy_reference.sh
      - name: Operator layer
        run: python -m pytest tests/test_operators.py -q
      - name: Invariants and contracts
        run: python -m pytest tests/test_invariants.py tests/test_panel.py tests/test_registry.py -q
      - name: Mutation suite
        run: python -m pytest tests/test_mutation.py -q
      - name: Golden snapshot offline check
        run: python -m pytest tests/test_golden.py -q
      - name: Golden snapshot regeneration check
        run: |
          # golden_snapshot.py --check 会用**本地 A 股数据源（MongoDB）**重建面板再比对；
          # CI runner 上没有该数据源 ⇒ 能连上才跑，连不上就**显式说明原因**（绝不静默跳过）。
          if python -c "import pymongo,sys;pymongo.MongoClient('mongodb://127.0.0.1:27017',serverSelectionTimeoutMS=2000).admin.command('ping')" 2>/dev/null; then
            python tools/golden_snapshot.py --check
          else
            echo "SKIP: 需要本地 MongoDB 才能重建面板；本步在 CI 不适用。"
            echo "      离线可复现的部分已由上一步 tests/test_golden.py（基于入库的 tests/golden/*.npz）覆盖。"
          fi
      - name: Conformance against paper formulas
        run: python tools/conformance_report.py
      - name: Full suite
        run: python -m pytest -q
