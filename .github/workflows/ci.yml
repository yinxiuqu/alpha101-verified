name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        # Dependency-drift guard (doc §9 R8): operators must behave identically
        # across the pandas versions we claim to support.
        pandas-version: ["2.1.*", "2.2.*", "2.3.*"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.26" "pandas==${{ matrix.pandas-version }}" "scipy>=1.11" pytest statsmodels
      - name: Operator layer (M1 gate: 20/20)
        run: python -m pytest tests/test_operators.py -q
      - name: Invariants + panel contract + registry
        run: python -m pytest tests/test_invariants.py tests/test_panel.py tests/test_registry.py -q
      - name: Mutation suite (each injected bug must be caught)
        run: python -m pytest tests/test_mutation.py -q
      - name: L5 golden snapshot (drift guard, doc §6.6)
        run: |
          python tools/golden_snapshot.py --check
          python -m pytest tests/test_golden.py -q
      - name: L2 conformance vs paper formulas (doc §6.2)
        run: python tools/conformance_report.py
      - name: Full suite
        run: python -m pytest -q
